# hyprlock — lock screen (Super+Escape, swayidle). Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Run with -c this file (~/.config/hypr/ is left free for Hyprland setups).
# Typed password shows as * in the middle; they turn green while checking, red on failure.

# Defaults, overridden by the file `wall` generates from the wallpaper.
$bg = rgb(121318)
$fg = rgb(e3e1e9)
$muted = rgb(45464f)
$ok = rgb(98c379)
$err = rgb(ffb4ab)
$wallpaper =   # empty = plain $bg
source = ~/.config/sway/hyprlock-colors.conf

general {
    hide_cursor = true
}

# Current wallpaper, blurred and darkened so the * stay readable.
background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 500, 60
    outline_thickness = 0
    inner_color = rgba(00000000)
    outer_color = rgba(00000000)
    font_color = $fg
    font_family = JetBrainsMono Nerd Font
    dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.2
    dots_center = true
    swap_font_color = true   # the * take check_color / fail_color
    check_color = $ok
    fail_color = $err
    fail_text = <i>senha incorreta</i>
    fade_on_empty = false
    placeholder_text =
    position = 0, -20
    halign = center
    valign = center
}

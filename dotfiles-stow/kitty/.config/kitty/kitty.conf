shell fish

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
symbol_map U+1F300-U+1F9FF,U+2600-U+26FF Noto Color Emoji

window_padding_width 6
confirm_os_window_close 0
enable_audio_bell no

# --- hardening ---
# Programs may write to the clipboard; reading it asks first (kitty default).
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
allow_remote_control no
# Ask before opening links printed by programs.
allow_hyperlinks ask

# Fallback theme, then the colors `wall` generates from the wallpaper (if present).
include current-theme.conf
globinclude colors.conf

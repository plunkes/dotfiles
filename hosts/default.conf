# Defaults for any machine. Override per machine in hosts/<hostname>.conf
# (same variables; only set what differs). Hardware itself is auto-detected.

KB_LAYOUT=us
KB_VARIANT=""
KB_OPTIONS=""

# Laptops only: TLP charge limit. "" = none. Lenovo IdeaPad-style
# conservation mode uses 1 (stops at ~60%); ThinkPads use a percentage.
CHARGE_STOP_THRESHOLD=""

# Hibernation swapfile. Empty = auto (laptops: yes, size = RAM).
HIBERNATE=""
SWAP_SIZE=""

EXTRA_PACKAGES=()
EXTRA_AUR=()

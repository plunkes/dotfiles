# /etc/greetd/config.toml — tuigreet login on tty1, launches Sway.
# @SWAY_CMD@ is filled in by scripts/08-system.sh (adds --unsupported-gpu on NVIDIA).
[terminal]
vt = 1

[default_session]
user = "greeter"
# One line: greetd's config parser has no multi-line strings.
# Grayscale theme matching the GRUB theme (grub/lunkes/theme.txt). Named colors only:
# the tty has 16 colors, no hex.
command = "tuigreet --cmd '@SWAY_CMD@' --time --time-format '%a %d %b  %H:%M' --remember --remember-user-session --asterisks --greeting 'welcome back' --width 50 --window-padding 2 --container-padding 2 --theme 'container=black;border=darkgray;title=white;greet=gray;text=gray;prompt=white;input=white;time=darkgray;action=darkgray;button=white'"
